services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    container_name: postgres_db
    ports:
      - "5555:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dagster-webserver:
    build: .
    container_name: dagster_webserver
    command: dagster dev -h 0.0.0.0 -p 3000 -m orchestration.dagster.definitions
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - .:/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres

  dagster-daemon:
    build: .
    container_name: dagster_daemon
    command: dagster-daemon run
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - .:/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
      - dagster-webserver

  dashboard:
    build: .
    container_name: streamlit_dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      - postgres

  stream_producer:
    build: .
    container_name: stream_producer
    command: python stream/producer/producer.py
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    depends_on:
      - kafka
    restart: unless-stopped

  stream_consumer:
    build: .
    container_name: stream_consumer
    command: python stream/consumer/consumer.py
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    depends_on:
      - kafka
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  dagster_home: